[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindstream"
version = "0.1.0"
description = "Milestone-1 POC for YouTube intelligence report generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "requests>=2.31.0",
  "youtube-transcript-api>=0.6.2",
  "jsonschema>=4.0.0",
  "python-dotenv>=1.0.0",
  "openai>=1.0.0",
  "streamlit",
  "scikit-learn",
  "hdbscan",
]

[project.scripts]
mindstream-report = "mindstream.cli.run_report:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
